name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --compact

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy production (local Windows runner)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on:
      - self-hosted
      - windows
      - x64
      - production
    environment:
      name: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
        shell: pwsh

      - name: Build frontend
        run: |
          npm ci
          npm run build
        shell: pwsh

      - name: Deploy to local production system
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_PATH)) {
            throw 'Set the PRODUCTION_PATH Actions variable to the existing Laravel installation directory.'
          }
          .\.github\scripts\deploy-production.ps1 -DeployPath $env:PRODUCTION_PATH
        shell: pwsh
        env:
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
