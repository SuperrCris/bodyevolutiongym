name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test --compact

  deploy:
    name: Deploy production (local Windows runner)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on:
      - self-hosted
      - windows
      - x64
      - production
    env:
      PHP_EXECUTABLE: 'C:\Users\HP\.local\php\8.5.12\php.exe'
    environment:
      name: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure PHP and Composer
        shell: powershell
        run: |
          $toolProfile = 'C:\Users\HP'
          $phpDirectory = Join-Path $toolProfile '.local\php\8.5.12'
          $composerDirectory = Join-Path $toolProfile '.config\herd-lite\bin'
          $phpExecutable = $env:PHP_EXECUTABLE
          $composerExecutable = Join-Path $composerDirectory 'composer.bat'

          if (-not (Test-Path -LiteralPath $phpExecutable -PathType Leaf)) {
            throw "PHP 8.5 was not found at $phpExecutable."
          }
          if (-not (Test-Path -LiteralPath $composerExecutable -PathType Leaf)) {
            throw "Composer was not found at $composerExecutable."
          }

          $env:PATH = "$phpDirectory;$composerDirectory;$env:PATH"
          $phpVersion = & $phpExecutable -r 'echo PHP_MAJOR_VERSION . chr(46) . PHP_MINOR_VERSION;'
          if ($LASTEXITCODE -ne 0 -or $phpVersion -ne '8.5') {
            throw "PHP 8.5 is required; found version $phpVersion."
          }

          $phpModules = & $phpExecutable -m
          if ($LASTEXITCODE -ne 0 -or $phpModules -notcontains 'pdo_pgsql') {
            throw 'The pdo_pgsql PHP extension is required for production migrations.'
          }

          & $composerExecutable --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Composer could not be started.'
          }

          $pathEntries = "$phpDirectory`n$composerDirectory`n"
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, $pathEntries, [System.Text.UTF8Encoding]::new($false))

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
        shell: powershell

      - name: Build frontend
        run: |
          npm ci
          npm run build
        shell: powershell

      - name: Deploy to local production system
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_PATH)) {
            throw 'Set the PRODUCTION_PATH Actions variable to the existing Laravel installation directory.'
          }
          .\.github\scripts\deploy-production.ps1 -DeployPath $env:PRODUCTION_PATH -PhpExecutable $env:PHP_EXECUTABLE
        shell: powershell
        env:
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
